
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GAbobeda Textil</title>
    <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>

    <h2>Control de Calidad: Mermas de Corte</h2>

    <div class="contenedor">

        <div class="formulario">
            <label for="idRollo">ID del Rollo:</label>
            <input type="text" id="idRollo">

            <label for="mtsTotales">Metros Totales:</label>
            <input type="number" id="mtsTotales">

            <label for="mtsDefecto">Metros con Defecto:</label>
            <input type="number" id="mtsDefecto">

            <button id="btnAuditar">Guardar Auditoría</button>

        </div>


        <div class="resultados">
            <table>
                <thead>
                    <tr>
                        <th>Rollo</th>
                        <th>Mts Totales</th>
                        <th>% Merma</th>
                        <th>Estado</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody id="tablaMermas"></tbody>
            </table>
        </div>
    </div>



    <script src="./js/app.js"></script>
</body>
</html>
